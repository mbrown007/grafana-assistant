# Dev HAProxy config mimicking production setup
# Production: mon.sabio.cloud on 443 -> grafana:3000, assistant:5480, etc.

global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 1m
    timeout server 1m
    timeout check 10s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s

frontend https_front
    bind *:8443 ssl crt /usr/local/etc/haproxy/certs/dev.pem
    mode http
    default_backend grafana_backend

    # Response headers (matching production)
    http-response set-header X-Content-Type-Options nosniff

    # Routing rules (matching production order)
    # /assistant/* goes to assistant - the backend strips the prefix
    # Do NOT add /api or /assets here - those are Grafana's paths too!
    use_backend assistant_backend if { path_beg /assistant }
    use_backend prometheus_backend if { path_beg /prometheus }
    use_backend alertmanager_backend if { path_beg /alertmanager }

    # Redirect /assistant to /assistant/ (matching production)
    http-request redirect code 301 location /assistant/ if { path -i /assistant }

#######################################################################
# CURRENT PRODUCTION CONFIG (broken cookies)
#######################################################################
backend assistant_backend_BROKEN
    mode http
    # This strips /assistant but doesn't tell the assistant about it
    http-request set-path %[path,regsub(^/assistant,)]
    server assistant assistant:5470 check resolvers docker init-addr last,libc,none

#######################################################################
# FIXED CONFIG - Option A: Strip prefix + forward original path
#######################################################################
backend assistant_backend
    mode http

    # Strip /assistant prefix (so assistant receives /api/chat, not /assistant/api/chat)
    http-request set-path %[path,regsub(^/assistant,)]

    # CRITICAL: Tell the assistant it's behind /assistant
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-request set-header X-Forwarded-Prefix /assistant

    server assistant assistant:5470 check resolvers docker init-addr last,libc,none

#######################################################################
# FIXED CONFIG - Option B: Don't strip, assistant handles /assistant
#######################################################################
# backend assistant_backend
#     mode http
#     # No path rewrite - assistant configured with base_path=/assistant
#     http-request set-header X-Forwarded-Proto https
#     http-request set-header X-Forwarded-Host %[req.hdr(Host)]
#     server assistant host.docker.internal:5470 check

backend grafana_backend
    mode http
    balance roundrobin
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    server grafana grafana:3000 check resolvers docker init-addr last,libc,none

backend prometheus_backend
    mode http
    http-request set-path %[path,regsub(^/prometheus,)]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    server prometheus host.docker.internal:19090 check

backend alertmanager_backend
    mode http
    http-request set-path %[path,regsub(^/alertmanager,)]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    server alertmanager host.docker.internal:19093 check
