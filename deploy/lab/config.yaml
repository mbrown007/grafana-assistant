# Monitoring Assistant - Lab Configuration
# Server: 10.222.251.176
# HAProxy: HTTPS 443 -> Grafana 3000, /assistant -> Assistant 5480
#
# HAProxy strips /assistant prefix and forwards X-Forwarded-Prefix header.
# The assistant reads this header to set correct cookie paths and frontend base path.

# Listen on port 5480 (HAProxy forwards /assistant/* here)
listen_addr: ":5480"

# Empty base_path - HAProxy strips /assistant before forwarding.
# The X-Forwarded-Prefix header tells the assistant its external path.
base_path: ""

# Grafana backend URL (direct, not via HAProxy)
grafana_url: "http://127.0.0.1:3000"

# Grafana service account token (set via environment variable or .env file)
# grafana_token: "glsa_xxx"

# Data retention
data_retention_days: 30
scratchpad_ttl_days: 7
scratchpad_folder: "Assistant Scratchpads"

# Database and logs (relative to working directory)
db_path: "data/assistant.db"
audit_log_path: "data/audit.log"

# OpenAI (set via environment variable: ASSISTANT_OPENAI_API_KEY)
openai_model: "gpt-4o"
model_profile:
  default: "balanced"
  family_overrides:
    gpt-4o-mini: compact

# Per-request budget guardrails
request_budget:
  max_prompt_tokens: 12000
  max_completion_tokens: 4000
  max_tool_iterations: 5
  max_tool_calls: 12
  max_estimated_cost_usd: 0.10
  prompt_cost_per_1m_usd: 0.80
  completion_cost_per_1m_usd: 3.20

# Knowledge base
kb_path: "KB"
kb_max_sections: 2
kb_max_section_chars: 2000

# Metrics
metrics_enabled: true

# Runtime feature flags
feature_flags:
  routing_mode: true
  composite_tool_mode: true
  judge_gate_mode: true
  evidence_redaction_mode: true

# Security - allow requests from HAProxy frontend
allowed_origin: "https://mon.sabio.cloud"

# MCP servers (stdio transport - binaries in same directory)
# Environment variables for each server come from .env file
mcp_servers:
  - name: "grafana"
    transport: "stdio"
    command: "./mcp-grafana"
    args:
      - "-transport"
      - "stdio"
      - "--enabled-tools"
      - "search,datasource,prometheus,loki,alerting,dashboard,navigation"
      - "--disable-write"
      - "--disable-admin"
    env:
      GRAFANA_URL: "http://127.0.0.1:3000"

  - name: "alertmanager"
    transport: "stdio"
    command: "./mcp-alertmanager"
    args: ["-transport", "stdio"]
    env:
      ALERTMANAGER_URL: "http://127.0.0.1:9093"

  - name: "kb"
    transport: "stdio"
    command: "./mcp-kb"
    args: ["-transport", "stdio"]
    env:
      KB_PATH: "./KB"
