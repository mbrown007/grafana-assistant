# Monitoring Assistant configuration
# Environment variable overrides: ASSISTANT_LISTEN_ADDR, ASSISTANT_GRAFANA_URL,
# ASSISTANT_GRAFANA_TOKEN, ASSISTANT_DATA_RETENTION_DAYS, ASSISTANT_DB_PATH,
# ASSISTANT_OPENAI_API_KEY, ASSISTANT_OPENAI_MODEL, ASSISTANT_BASE_PATH
#
# Secrets can also be placed in a .env file (auto-loaded from working directory).

# Address to listen on (host:port)
listen_addr: ":8080"

# Grafana base URL (required).
# Grafana must be configured with serve_from_sub_path=true and
# root_url pointing to this app's /grafana/ path, e.g.:
#   GF_SERVER_ROOT_URL=http://localhost:13000/grafana/
#   GF_SERVER_SERVE_FROM_SUB_PATH=true
grafana_url: "http://localhost:13000"

# Grafana service account token (for API access to dashboards)
# grafana_token: "glsa_..."

# Number of days to retain chat history (default: 30)
data_retention_days: 30
scratchpad_ttl_days: 7
scratchpad_folder: "Assistant Scratchpads"

# SQLite database path (default: data/assistant.db)
db_path: "data/assistant.db"

# Audit log path (JSONL). Ensure the directory exists and is writable.
# Set to empty string to disable file auditing.
audit_log_path: "/var/log/grafana-assistant/audit.log"

# Base path to serve the UI/API under (empty = root).
# Example: "/assistant"
# base_path: "/assistant"

# OpenAI API key (required for chat assistant)
# openai_api_key: "sk-..."

# OpenAI model (default: gpt-4o)
openai_model: "gpt-4o"

# Knowledge base folder (default: "KB")
# kb_path: "KB"
# kb_max_sections: 2          # Max KB sections to inject per request
# kb_max_section_chars: 2000  # Max chars per KB section

# Hybrid KB: structured (token) and vector (embedding) search
# kb_structured_path: "KB/runbooks"           # Token index source
# kb_vector_path: ""                           # Markdown files for vector index (empty = disabled)
# kb_vector_db_path: "KB/.kb_vectors.db"      # SQLite vector store
# kb_embedding_model: "text-embedding-3-small" # OpenAI embedding model
# kb_vector_max_results: 2                     # Max vector results per query
# kb_dashboard_map:
#   monitoring-assistant-dev: "Monitoring_Assistant/monitoring_assistant_dev_dashboard.md"
#   monitoring assistant (dev): "Monitoring_Assistant/monitoring_assistant_dev_dashboard.md"
#   monitoring assistant observability: "Monitoring_Assistant/monitoring_assistant_observability_dashboard.md"

# Prometheus metrics (default: true)
metrics_enabled: true

# Security settings
# allowed_origin: "http://localhost:8080"   # CORS origin (auto-derived from listen_addr if blank)
# max_message_length: 16000                 # Max chat message chars
# max_body_size: 65536                      # Max request body bytes
# rate_limit_per_minute: 20                 # Chat requests per user per minute
# rate_limit_burst: 5                       # Burst allowance

# MCP servers for tool integration (SSE or stdio transport).
# For SSE, each server must be running before the assistant starts.
mcp_servers:
  - type: "alertmanager"
    transport: "sse"
    url: "http://localhost:8000"
  - type: "grafana"
    transport: "sse"
    url: "http://localhost:8001"
  - type: "genesyscloud"
    transport: "sse"
    url: "http://localhost:8002"
  - type: "kb"
    transport: "sse"
    url: "http://localhost:8003"

# Example stdio server (launched by the assistant):
# mcp_servers:
#   - type: "alertmanager"
#     transport: "stdio"
#     command: "/usr/local/bin/alertmanager-mcp-server"
#     args: ["-transport", "stdio"]
#     env:
#       ALERTMANAGER_URL: "http://localhost:9093"
