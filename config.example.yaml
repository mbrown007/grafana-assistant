# Monitoring Assistant configuration
# Environment variable overrides: ASSISTANT_LISTEN_ADDR, ASSISTANT_GRAFANA_URL,
# ASSISTANT_GRAFANA_TOKEN, ASSISTANT_DATA_RETENTION_DAYS, ASSISTANT_DB_PATH,
# ASSISTANT_OPENAI_API_KEY, ASSISTANT_OPENAI_MODEL, ASSISTANT_BASE_PATH,
# ASSISTANT_MODEL_PROFILE, ASSISTANT_MODEL_PROFILE_DEFAULT,
# ASSISTANT_REQUEST_BUDGET_MAX_PROMPT_TOKENS,
# ASSISTANT_REQUEST_BUDGET_MAX_COMPLETION_TOKENS,
# ASSISTANT_REQUEST_BUDGET_MAX_TOOL_ITERATIONS,
# ASSISTANT_REQUEST_BUDGET_MAX_TOOL_CALLS,
# ASSISTANT_REQUEST_BUDGET_MAX_ESTIMATED_COST_USD,
# ASSISTANT_REQUEST_BUDGET_PROMPT_COST_PER_1M_USD,
# ASSISTANT_REQUEST_BUDGET_COMPLETION_COST_PER_1M_USD,
# ASSISTANT_FEATURE_ROUTING_MODE, ASSISTANT_FEATURE_COMPOSITE_TOOL_MODE,
# ASSISTANT_FEATURE_JUDGE_GATE_MODE, ASSISTANT_FEATURE_EVIDENCE_REDACTION_MODE,
# ASSISTANT_FEATURE_CHATOPS_ENABLED, ASSISTANT_CHATOPS_PROVIDER,
# ASSISTANT_CHATOPS_BOT_USER_ID, ASSISTANT_CHATOPS_BOT_USER_NAME,
# ASSISTANT_CHATOPS_BOT_ORG_ID, ASSISTANT_CHATOPS_MATTERMOST_URL,
# ASSISTANT_CHATOPS_MATTERMOST_TOKEN, ASSISTANT_CHATOPS_MATTERMOST_TEAM,
# ASSISTANT_EVAL_FIXTURE_RECORD_DIR, ASSISTANT_EVAL_BYPASS_AUTH
#
# Secrets can also be placed in a .env file (auto-loaded from working directory).

# Address to listen on (host:port)
listen_addr: ":8080"

# Grafana base URL (required).
# Grafana must be configured with serve_from_sub_path=true and
# root_url pointing to this app's /grafana/ path, e.g.:
#   GF_SERVER_ROOT_URL=http://localhost:13000/grafana/
#   GF_SERVER_SERVE_FROM_SUB_PATH=true
grafana_url: "http://localhost:13000"

# Grafana service account token (for API access to dashboards)
# grafana_token: "glsa_..."

# Number of days to retain chat history (default: 30)
data_retention_days: 30
scratchpad_ttl_days: 7
scratchpad_folder: "Assistant Scratchpads"

# SQLite database path (default: data/assistant.db)
db_path: "data/assistant.db"

# Audit log path (JSONL). Ensure the directory exists and is writable.
# Set to empty string to disable file auditing.
audit_log_path: "/var/log/grafana-assistant/audit.log"

# Optional: record successful MCP tool responses as eval fixtures for replay.
# eval_fixture_record_dir: "tests/evals/fixtures"

# Dev/test only: bypass Grafana session auth and use a synthetic eval user.
# Never enable in production.
# eval_bypass_auth: false

# Base path to serve the UI/API under (empty = root).
# Example: "/assistant"
# base_path: "/assistant"

# OpenAI API key (required for chat assistant)
# openai_api_key: "sk-..."

# OpenAI model (default: gpt-4o)
openai_model: "gpt-4o"

# Model prompt profile resolution (P6-2)
# name: explicit profile override (optional; if set, family matching is skipped)
# default: fallback profile when no family override matches
# family_overrides: longest matching model-family prefix wins
# model_profile:
#   name: ""
#   default: "balanced"     # balanced | compact | strict
#   family_overrides:
#     gpt-4o-mini: compact
#     gpt-4.1-mini: compact
#     gpt-4o: balanced
#     gpt-4.1: strict

# Per-request budget guardrails (P6-3)
# request_budget:
#   max_prompt_tokens: 12000
#   max_completion_tokens: 4000
#   max_tool_iterations: 5
#   max_tool_calls: 12
#   max_estimated_cost_usd: 0.10
#   prompt_cost_per_1m_usd: 0.80
#   completion_cost_per_1m_usd: 3.20

# Knowledge base folder (default: "KB")
# kb_path: "KB"
# kb_max_sections: 2          # Max KB sections to inject per request
# kb_max_section_chars: 2000  # Max chars per KB section

# Hybrid KB: structured (token) and vector (embedding) search
# kb_structured_path: "KB/runbooks"           # Token index source
# kb_vector_path: ""                           # Markdown files for vector index (empty = disabled)
# kb_vector_db_path: "KB/.kb_vectors.db"      # SQLite vector store
# kb_embedding_model: "text-embedding-3-small" # OpenAI embedding model
# kb_vector_max_results: 2                     # Max vector results per query
# kb_dashboard_map:
#   monitoring-assistant-dev: "Monitoring_Assistant/monitoring_assistant_dev_dashboard.md"
#   monitoring assistant (dev): "Monitoring_Assistant/monitoring_assistant_dev_dashboard.md"
#   monitoring assistant observability: "Monitoring_Assistant/monitoring_assistant_observability_dashboard.md"

# Prometheus metrics (default: true)
metrics_enabled: true

# Security settings
# allowed_origin: "http://localhost:8080"   # CORS origin (auto-derived from listen_addr if blank)
# max_message_length: 16000                 # Max chat message chars
# max_body_size: 65536                      # Max request body bytes
# rate_limit_per_minute: 20                 # Chat requests per user per minute
# rate_limit_burst: 5                       # Burst allowance
# investigation_tool_timeout_seconds: 8      # Timeout budget for composite fetch tool actions

# Runtime feature flags for rollout/rollback
# feature_flags:
#   routing_mode: true            # Enable schema/dashboard/KB routing strategy
#   composite_tool_mode: true     # Enable internal investigation__manage tool
#   judge_gate_mode: true         # Enable eval quality-gate enforcement
#   evidence_redaction_mode: true # Redact secrets from streamed evidence payloads
#   chatops_enabled: true         # Enable ChatOps messaging bridge

# ChatOps bridge (optional). Connects the assistant to a messaging platform.
# Run `make mattermost-setup` to create the bot account and get the token.
# chatops:
#   provider: mattermost
#   bot_user_id: 99               # Synthetic Grafana user ID for session ownership
#   bot_user_name: assistant-bot  # Display name in audit log
#   bot_org_id: 1                 # Grafana org for session context
#   mattermost:
#     url: http://localhost:18065
#     token: "<bot-personal-access-token>"
#     team_name: monitoring
#     channel_ids: []             # Empty = listen on all channels

# MCP servers for tool integration (SSE or stdio transport).
# For SSE, each server must be running before the assistant starts.
mcp_servers:
  - type: "alertmanager"
    transport: "sse"
    url: "http://localhost:8000"
  - type: "grafana"
    transport: "sse"
    url: "http://localhost:8001"
    # Optional per-server tool filters (exact tool names, with or without "<type>__" prefix).
    # Denylist always wins over allowlist if a tool appears in both.
    # tool_allowlist:
    #   - "query_prometheus"
    #   - "query_loki_logs"
    #   - "search_dashboards"
    # tool_denylist:
    #   - "update_dashboard"
  - type: "genesyscloud"
    transport: "sse"
    url: "http://localhost:8002"
  - type: "kb"
    transport: "sse"
    url: "http://localhost:8003"

# Example stdio server (launched by the assistant):
# mcp_servers:
#   - type: "alertmanager"
#     transport: "stdio"
#     command: "/usr/local/bin/alertmanager-mcp-server"
#     args: ["-transport", "stdio"]
#     env:
#       ALERTMANAGER_URL: "http://localhost:9093"
