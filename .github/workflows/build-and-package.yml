name: Build, Package, and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      archive_path: ${{ steps.create_archive.outputs.path }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Get version
      id: get_version
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        else
          echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        fi

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.22'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install frontend dependencies
      run: npm --prefix frontend install

    - name: Build frontend
      run: make frontend-build

    - name: Build backend
      run: make build

    - name: Build MCP servers
      run: make mcp-build

    - name: Create package directory
      run: mkdir -p release

    - name: Copy binaries
      run: |
        cp bin/assistant release/
        cp bin/mcp-alertmanager release/
        cp bin/mcp-grafana release/
        cp bin/mcp-genesyscloud release/
        cp bin/mcp-kb release/

    - name: Copy config files
      run: |
        cp config.example.yaml release/
        mkdir -p release/deploy
        cp deploy/config.stdio.example.yaml release/deploy/
        cp deploy/assistant.env.example release/deploy/
        cp deploy/monitoring-assistant.service release/deploy/

    - name: Copy documentation
      run: |
        cp README.md release/
        cp -r docs release/

    - name: Create archive
      id: create_archive
      run: |
        ARCHIVE_NAME="monitoring-assistant-${{ steps.get_version.outputs.version }}.tar.gz"
        tar -czvf $ARCHIVE_NAME -C release .
        echo "path=$ARCHIVE_NAME" >> $GITHUB_OUTPUT

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: monitoring-assistant
        path: ${{ steps.create_archive.outputs.path }}

  release:
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: monitoring-assistant

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ needs.build-and-package.outputs.archive_path }}
        tag_name: ${{ needs.build-and-package.outputs.version }}
        name: "Release ${{ needs.build-and-package.outputs.version }}"
        body: "Release ${{ needs.build-and-package.outputs.version }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
