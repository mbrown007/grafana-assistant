services:
  prometheus:
    image: prom/prometheus:v2.45.3
    restart: unless-stopped
    volumes:
      - ./containers/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --web.enable-remote-write-receiver
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "19090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./containers/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "19093:9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10
  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    ports:
      - "13000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost:13000/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./containers/grafana/provisioning:/etc/grafana/provisioning
      - ./containers/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
      - alertmanager
      - loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/grafana/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  loki:
    image: grafana/loki:3.6.0
    restart: unless-stopped
    user: "0"
    ports:
      - "13100:3100"
    volumes:
      - ./containers/loki/loki-config.yaml:/mnt/config/loki-config.yaml
    command:
      - -config.file=/mnt/config/loki-config.yaml

  promtail:
    image: grafana/promtail:3.6.0
    restart: unless-stopped
    volumes:
      - ./containers/loki/promtail-config.yaml:/mnt/config/promtail-config.yaml
      - /var/log:/var/log
      - ./data:/host-project/data
    command:
      - -config.file=/mnt/config/promtail-config.yaml
    depends_on:
      - loki
    extra_hosts:
      - "host.docker.internal:host-gateway"
